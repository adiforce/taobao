<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>淘寶代購管理</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1f2933; --sub:#6b7785; --accent:#e8590c; --accent-d:#c24a08; --ok:#2b8a3e; --bad:#c92a2a; --warn:#f08c00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
  header { position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); padding:8px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  nav { display:flex; gap:4px; flex:1; flex-wrap:wrap; }
  nav button { border:0; background:transparent; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:16px; color:var(--sub); }
  nav button.on { background:#fff0e6; color:var(--accent-d); font-weight:600; }
  main { padding:14px 16px; max-width:none; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:14px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  input, select, textarea { font:inherit; padding:8px 10px; border:1px solid #cfd5dc; border-radius:6px; background:#fff; max-width:100%; }
  input:focus, select:focus, textarea:focus { outline:2px solid #ffd8bf; border-color:var(--accent); }
  button.btn { font:inherit; border:1px solid #cfd5dc; background:#fff; padding:8px 16px; border-radius:6px; cursor:pointer; }
  button.btn:hover { background:#f1f3f5; }
  button.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.pri:hover { background:var(--accent-d); }
  button.danger { color:var(--bad); }
  button.sm { padding:3px 10px; font-size:13px; }
  .tablewrap { overflow:auto; max-height:78vh; border:1px solid var(--line); border-radius:6px; }
  table { border-collapse:collapse; width:100%; background:#fff; font-size:14px; }
  th, td { padding:7px 9px; border-bottom:1px solid #eef0f2; text-align:left; white-space:nowrap; }
  th { position:sticky; top:0; background:#f1f3f5; font-weight:600; z-index:1; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  td.wrap { white-space:normal; min-width:120px; }
  tr:hover td { background:#fffaf5; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; background:#e9ecef; }
  .tag.s-已下單 { background:#e7f5ff; color:#1971c2; }
  .tag.s-在集運倉 { background:#fff3bf; color:#8a6d00; }
  .tag.s-集運回台 { background:#e5dbff; color:#5f3dc4; }
  .tag.s-已出貨 { background:#ffe8cc; color:#d9480f; }
  .tag.s-已完成 { background:#d3f9d8; color:var(--ok); }
  .dup { background:#ffe3e3; color:var(--bad); font-weight:700; }
  .muted { color:var(--sub); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .stat b { display:block; font-size:22px; margin-top:2px; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; z-index:50; }
  .modal-bg.on { display:flex; }
  .modal { background:#fff; border-radius:10px; padding:20px; width:100%; max-width:760px; }
  .modal h3 { margin:0 0 10px; }
  .form { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--sub); }
  .form label.full { grid-column:1 / -1; }
  .form input, .form select, .form textarea { width:100%; color:var(--text); font-size:16px; }
  .preview { grid-column:1 / -1; background:#fff8f0; border:1px dashed #ffc078; border-radius:6px; padding:8px 10px; font-size:13px; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; align-items:center; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#212529; color:#fff; padding:8px 16px; border-radius:20px; display:none; z-index:130; max-width:90vw; }
  #toast.err { background:var(--bad); }
  #mask { position:fixed; inset:0; background:rgba(255,255,255,.55); display:none; align-items:center; justify-content:center; z-index:120; cursor:wait; }
  #mask.on { display:flex; }
  #mask .mbox { background:#212529; color:#fff; padding:12px 22px; border-radius:10px; font-size:16px; display:flex; align-items:center; gap:10px; box-shadow:0 4px 18px rgba(0,0,0,.25); }
  .spin { width:16px; height:16px; border:3px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #loading { position:fixed; top:0; left:0; right:0; height:3px; background:var(--accent); display:none; z-index:100; animation:ld 1s infinite; }
  @keyframes ld { 0%{transform:scaleX(0);transform-origin:left} 50%{transform:scaleX(1);transform-origin:left} 51%{transform-origin:right} 100%{transform:scaleX(0);transform-origin:right} }
  .hide { display:none !important; }
  textarea.list { height:120px; }
  a { color:#1971c2; text-decoration:none; } a:hover { text-decoration:underline; }
  @media (max-width:760px) {
    body { font-size:15px; }
    header { padding:6px 10px; gap:6px; }
    header h1 { font-size:16px; }
    nav button { padding:8px 10px; font-size:15px; }
    main { padding:8px; }
    .card { padding:8px; }
    .form { grid-template-columns:1fr; }
    .modal-bg { padding:8px 6px; }
    .modal { padding:14px; }
    .bar input, .bar select { flex:1 1 130px; min-width:0; }
    button.btn, button.sm { padding:8px 12px; font-size:14px; }
    input[type=checkbox] { width:22px; height:22px; }
    .tablewrap { max-height:none; overflow:visible; border:0; }
    table, tbody { display:block; width:100%; background:transparent; }
    tr.hr { display:none; }
    tr.dr { display:block; background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin:0 0 10px; }
    td { display:flex; justify-content:space-between; align-items:center; gap:12px; white-space:normal; text-align:right; border:0; padding:4px 2px; min-width:0; }
    td::before { content:attr(data-label); flex:0 0 auto; text-align:left; color:var(--sub); font-size:12px; }
    td[data-label=""]::before, td[colspan]::before { display:none; }
    td[colspan] { display:block; text-align:left; }
    td.wrap { min-width:0; }
    td.n { text-align:right; }
    td[data-label=""] { justify-content:flex-start; }
    tr:hover td { background:transparent; }
  }
</style>
</head>
<body>
<div id="loading"></div>
<div id="mask"><div class="mbox"><span class="spin"></span>處理中，請稍候…</div></div>
<header>
  <h1>🛒 淘寶代購管理</h1>
  <nav id="nav">
    <button data-t="orders" class="on">訂單</button>
    <button data-t="batches">集運單</button>
    <button data-t="settle">結算</button>
    <button data-t="pay">付款紀錄</button>
    <button data-t="set">設定</button>
  </nav>
  <button class="btn" onclick="load()">↻ 重新整理</button>
</header>

<main>
  <!-- 訂單 -->
  <section id="t-orders">
    <div class="card">
      <div class="bar">
        <input id="f-q" placeholder="搜尋品名 / 運單 / 備註" oninput="renderOrders()" style="min-width:180px">
        <select id="f-status" onchange="renderOrders()"></select>
        <select id="f-who" onchange="renderOrders()"></select>
        <select id="f-batch" onchange="renderOrders()"></select>
        <label><input type="checkbox" id="f-dup" onchange="renderOrders()"> 只看重複運單</label>
        <label><input type="checkbox" id="f-nw" onchange="renderOrders()"> 只看未填重量</label>
        <label><input type="checkbox" id="f-inc" onchange="renderOrders()"> 只看資料不完整</label>
        <span style="flex:1"></span>
        <button class="btn" onclick="openWeights()">⚖ 補重量</button>
        <button class="btn pri" onclick="openOrder()">＋ 新增訂單</button>
      </div>
      <div id="o-pending" style="margin-bottom:8px"></div>
      <div class="bar hide" id="bulk" style="background:#fff8f0;padding:6px 8px;border-radius:6px">已選 <b id="bulk-n">0</b> 筆　<button class="btn pri" onclick="openBatchFromSel()">📦 建立集運單</button><select id="bulk-batch"></select><select id="bulk-status"></select><button class="btn pri" onclick="bulkApply()">套用</button><button class="btn" onclick="clearSel()">取消選取</button></div>
      <div class="muted" id="o-sum" style="margin-bottom:8px"></div>
      <div class="tablewrap"><table id="o-table"></table></div>
    </div>
  </section>

  <!-- 集運單 -->
  <section id="t-batches" class="hide">
    <div class="card">
      <div class="bar"><b>集運單</b><span class="muted">（重量差超過 ±2kg 會標橘色，通常是漏填或填錯品項重量）</span><span style="flex:1"></span>
        <button class="btn pri" onclick="openBatch()">＋ 新增集運單</button></div>
      <div class="tablewrap"><table id="b-table"></table></div>
    </div>
  </section>

  <!-- 結算 -->
  <section id="t-settle" class="hide">
    <div class="card"><b>各人應付</b>
      <div class="muted" style="margin:4px 0 8px">應付只計入「已集運」的訂單（運費已分攤）；尚未集運的商品列在「待出貨」，運費還沒算進去。</div>
      <div class="tablewrap"><table id="s-table"></table></div>
      <div id="s-check" style="margin-top:8px"></div>
    </div>
    <div class="card"><b>集運單 × 人員分攤（台幣）</b>
      <div class="tablewrap" style="margin-top:8px"><table id="m-table"></table></div>
    </div>
  </section>

  <!-- 付款 -->
  <section id="t-pay" class="hide">
    <div class="card">
      <b>登記付款</b>
      <div class="bar" style="margin-top:8px">
        <input type="date" id="p-date">
        <select id="p-who"></select>
        <input type="number" id="p-amt" placeholder="金額(台)" step="1" style="width:110px">
        <select id="p-method"></select>
        <select id="p-batch"></select>
        <input id="p-note" placeholder="備註" style="min-width:140px">
        <button class="btn pri" onclick="addPay()">登記</button>
      </div>
    </div>
    <div class="card">
      <div class="bar"><b>付款紀錄</b><select id="p-filter" onchange="renderPay()"></select></div>
      <div class="tablewrap"><table id="p-table"></table></div>
    </div>
  </section>

  <!-- 設定 -->
  <section id="t-set" class="hide">
    <div class="card" style="max-width:640px">
      <b>費率與清單</b>
      <div class="form" style="margin-top:10px">
        <label>淘寶交易手續費率（0.03 = 3%）<input type="number" id="s-fee" step="0.001"></label>
        <label>刷卡手續費率<input type="number" id="s-card" step="0.001"></label>
        <label>刷卡回饋率（預設）<input type="number" id="s-reward" step="0.001"></label>
        <label>代墊人（收款人）<select id="s-payer"></select></label>
        <label>匯率來源（臺灣銀行牌告，人民幣）<select id="s-rtype"></select></label>
        <label>人員（一行一個，最多 8）<textarea class="list" id="s-people"></textarea></label>
        <label>收件人（姓名 電話，一行一個）<textarea class="list" id="s-rcps"></textarea></label>
        <label>收件地址（一行一個）<textarea class="list" id="s-addrs"></textarea></label>
        <label>集運／物流公司（一行一個：名稱|查詢網址，單號位置用 {num}）<textarea class="list" id="s-carriers"></textarea></label>
        <label>狀態（一行一個，最多 8）<textarea class="list" id="s-statuses"></textarea></label>
        <label>付款方式（一行一個，最多 8）<textarea class="list" id="s-methods"></textarea></label>
      </div>
      <div class="actions"><button class="btn pri" onclick="saveSet()">儲存設定</button></div>
      <div class="muted" style="margin-top:8px">改費率會影響整份試算表所有訂單的重新計算（含歷史訂單）。</div>
    </div>
  </section>
</main>

<!-- 訂單 modal -->
<div class="modal-bg" id="m-order"><div class="modal">
  <h3 id="mo-title">新增訂單</h3>
  <div class="form">
    <label>下單日<input type="date" id="o-date" onchange="dateChanged('o')"></label>
    <label>WHO<select id="o-who" onchange="whoChange()"></select>
      <span id="o-newwho" class="hide" style="display:flex;gap:6px"><input id="o-newwho-in" placeholder="新人員名稱"><button type="button" class="btn sm" onclick="addPersonInline()">加入</button></span></label>
    <label class="full">品名<input id="o-name"></label>
    <label>商品金額 ¥（含運；對方自己下標、只幫忙集運的可留空）<input type="number" id="o-cny" step="0.01" oninput="calcOrder()"></label>
    <label><a href="https://rate.bot.com.tw/xrt/quote/ltm/CNY" target="_blank" rel="noopener" title="開啟臺灣銀行人民幣牌告匯率">匯率 🔗</a> <span id="o-rate-note"></span>
      <span style="display:flex;gap:6px"><input type="number" id="o-rate" step="0.001" oninput="rateManual('o');calcOrder()"><button type="button" class="btn sm" onclick="fetchRate('o')">取匯率</button></span></label>
    <label>重量 kg（集運後才知道，可先空白）<input type="number" id="o-weight" step="0.01"></label>
    <label>集運單（待集運請留空）<select id="o-batch"></select></label>
    <label>運單編號<input id="o-track" inputmode="numeric"></label>
    <label>淘寶訂單號<input id="o-tb" inputmode="numeric"></label>
    <label>狀態<select id="o-status"></select></label>
    <div class="preview hide" id="o-lock"></div>
    <label>備註<input id="o-note"></label>
    <div class="preview" id="o-prev"></div>
  </div>
  <div class="actions">
    <label class="muted" id="o-again-wrap"><input type="checkbox" id="o-again"> 存完繼續新增</label>
    <button class="btn" onclick="closeM('m-order')">取消</button>
    <button class="btn pri" id="o-save" onclick="saveOrder()">儲存</button>
  </div>
</div></div>

<!-- 集運單 modal -->
<div class="modal-bg" id="m-batch"><div class="modal">
  <h3 id="mb-title">新增集運單</h3>
  <div class="form">
    <label>日期<input type="date" id="b-date" onchange="dateChanged('b')"></label>
    <label>集運單名稱（空白＝日期_公斤KG，例：20261113_34KG）<input id="b-name"></label>
    <label>計費公斤<input type="number" id="b-kg" step="0.01" oninput="autoShip()" onchange="kgBlank()"></label>
    <label>單價 ¥/kg<input type="number" id="b-unit" step="0.01" oninput="autoShip()"></label>
    <label>運費 ¥<input type="number" id="b-cny" step="0.01" oninput="this.dataset.manual=1;calcBatch()"></label>
    <label><a href="https://rate.bot.com.tw/xrt/quote/ltm/CNY" target="_blank" rel="noopener" title="開啟臺灣銀行人民幣牌告匯率">匯率 🔗</a> <span id="b-rate-note"></span>
      <span style="display:flex;gap:6px"><input type="number" id="b-rate" step="0.001" oninput="rateManual('b');calcBatch()"><button type="button" class="btn sm" onclick="fetchRate('b')">取匯率</button></span></label>
    <label>收件人<select id="b-rcp"></select></label>
    <label>收件地址<select id="b-addr"></select></label>
    <label>物流公司<select id="b-car" onchange="carChg()"></select></label>
    <label>運單號（也可直接貼整條查詢網址，會自動抽出單號）<input id="b-link" oninput="linkIn()"></label>
    <label class="full">備註<input id="b-note"></label>
    <label id="b-st-wrap" class="hide">歸入後訂單狀態<select id="b-st"></select></label>
    <div class="preview hide" id="b-sel"></div>
    <div class="preview" id="b-prev"></div>
  </div>
  <div class="actions">
    <button class="btn" onclick="closeM('m-batch')">取消</button>
    <button class="btn pri" onclick="saveBatch()">儲存</button>
  </div>
</div></div>

<!-- 拆單 modal -->
<div class="modal-bg" id="m-split"><div class="modal">
  <h3 id="sp-title">拆單</h3>
  <div class="muted" id="sp-info" style="margin-bottom:8px"></div>
  <table id="sp-table"></table>
  <div class="bar" style="margin-top:8px"><button class="btn sm" onclick="spAdd()">＋ 加一份</button><span id="sp-sum"></span></div>
  <div class="actions"><button class="btn" onclick="closeM('m-split')">取消</button><button class="btn pri" onclick="saveSplit()">拆單</button></div>
</div></div>

<!-- 補重量 modal -->
<div class="modal-bg" id="m-weights"><div class="modal" style="max-width:980px">
  <h3>補重量</h3>
  <div class="bar"><select id="w-batch" onchange="renderWeights()"></select><label><input type="checkbox" id="w-only" checked onchange="renderWeights()"> 只列未填重量</label></div>
  <div class="tablewrap" style="max-height:55vh"><table id="w-table"></table></div>
  <div class="actions"><span class="muted" id="w-sum" style="flex:1"></span><button class="btn" onclick="closeM('m-weights')">取消</button><button class="btn pri" onclick="saveWeights()">儲存</button></div>
</div></div>

<!-- 出貨資訊 modal -->
<div class="modal-bg" id="m-ship"><div class="modal">
  <h3>集運出貨資訊</h3>
  <div class="form">
    <label>收件人<select id="sh-rcp" onchange="buildShip()"></select></label>
    <label>收件地址<select id="sh-addr" onchange="buildShip()"></select></label>
    <label class="full">產生結果（可再修改，按複製）<textarea id="sh-out" rows="9"></textarea></label>
  </div>
  <div class="actions"><button class="btn" onclick="closeM('m-ship')">關閉</button><button class="btn pri" onclick="copyShip()">複製</button></div>
</div></div>

<div class="modal-bg" id="m-stmt"><div class="modal">
  <h3>📄 對帳單 <span id="st-who"></span></h3>
  <div class="bar"><label><input type="checkbox" id="st-pend" onchange="buildStmt()"> 附上「尚未集運」的商品（運費還沒算，不計入應付）</label>
    <label><input type="checkbox" id="st-paid" checked onchange="buildStmt()"> 列出已付款紀錄</label></div>
  <textarea id="st-out" rows="18" style="width:100%"></textarea>
  <div class="actions"><button class="btn" onclick="closeM('m-stmt')">關閉</button><button class="btn pri" onclick="copyStmt()">複製（貼到 LINE）</button></div>
</div></div>

<div id="toast"></div>

<script>
var TOKEN = '', D = null, curTab = 'orders', editId = null, editBatch = null;

/* ---------- 共用 ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function fmt(n, d) { if (n === '' || n == null || isNaN(n)) return ''; d = d == null ? 2 : d; return Number(n).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function r2(x) { return Math.round(x * 100) / 100; }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2200); }
var MASKN = 0, MASKT = null;
function busy(on, block) {
  $('loading').style.display = on ? 'block' : 'none';
  if (!block) return;
  MASKN += on ? 1 : -1; if (MASKN < 0) MASKN = 0;
  clearTimeout(MASKT);
  if (MASKN > 0) $('mask').classList.add('on');
  else MASKT = setTimeout(function () { if (MASKN === 0) $('mask').classList.remove('on'); }, 120);   // 連續多步驟（建集運單→歸入→重載）之間不閃爍
}
function run(fn, args, okMsg) {
  var blk = fn !== 'getRate';      // 背景查匯率不擋畫面
  busy(true, blk);
  return new Promise(function (res, rej) {
    var g = google.script.run.withSuccessHandler(function (r) { busy(false, blk); if (okMsg) toast(okMsg); res(r); })
      .withFailureHandler(function (e) {
        busy(false, blk);
        var m = e && e.message ? e.message : String(e);
        toast(m.replace(/^Error:\s*/, ''), true); rej(e);
      });
    g.api(TOKEN, fn, args || []);
  });
}
function opts(list, blank, sel) {
  return (blank != null ? '<option value="">' + esc(blank) + '</option>' : '') +

}
function closeM(id) { $(id).classList.remove('on'); }

/* ---------- 訂單 ---------- */
var LOCKED = ['集運回台', '已完成'];
function isLocked(o) { return LOCKED.indexOf(o.status) >= 0; }
function noW(o) { return !(Number(o.weight) > 0); }
function missing(o) {      // 資料不完整的訂單不能勾選（品名、WHO、運單、重量要有；金額可空，對方自己下標的只分攤集運費）
  var m = [];
  if (!String(o.name).trim()) m.push('品名');
  if (!o.who) m.push('WHO');
  if (!String(o.track).trim()) m.push('運單');
  if (noW(o)) m.push('重量');
  return m;
}
var SEL = {}, visibleIds = [];
function renderOrders() {
  if (!D) return;

  Object.keys(SEL).forEach(function (id) { var o = D.orders.filter(function (x) { return x.id === id; })[0]; if (!o || missing(o).length) delete SEL[id]; });
  var pend = D.orders.filter(function (o) { return o.batch === ''; }), pk = 0, pn = 0;
  pend.forEach(function (o) { if (noW(o)) pn++; else pk += Number(o.weight); });
  $('o-pending').innerHTML = '📦 待集運：<b>' + pend.length + '</b> 筆，已知重量 <b>' + fmt(pk, 1) + '</b> kg' + (pn ? '，<span class="warn">' + pn + ' 筆還沒填重量</span>' : '');
  var rows = D.orders.filter(function (o) {
    if (st && o.status !== st) return false;

    if (bt === '__none' ? o.batch !== '' : (bt && o.batch !== bt)) return false;
    if (dup && !o.dup) return false;
    if (nw && !noW(o)) return false;
    if ($('f-inc').checked && !missing(o).length) return false;
    if (q && (o.name + ' ' + o.track + ' ' + o.tb + ' ' + o.note + ' ' + o.id).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.row - a.row; });

      '<td>' + esc(String(o.date).slice(2)) + '</td><td class="wrap">' + esc(o.name) + (miss.length ? '<div class="bad" style="font-size:12px">缺：' + esc(miss.join('、')) + '</div>' : '') + '</td>' +
      '<td class="wrap' + (o.dup ? ' dup' : '') + '" style="word-break:break-all">' + esc(o.track) + (o.dup ? ' ⚠重複' : '') + (o.tb ? '<div class="muted">' + esc(o.tb) + '</div>' : '') + '</td>' +
      '<td class="n">' + (noW(o) ? (o.batch ? '<span class="warn">未填</span>' : '<span class="muted">-</span>') : fmt(o.weight)) + '</td><td>' + esc(o.who) + '</td>' +
      '<td class="n">' + fmt(o.cny) + '<div class="muted">× ' + fmt(o.rate, 3) + '</div></td>' +
      '<td class="n">' + fmt(o.twd) + '</td><td class="n" title="' + (o.share === '' ? '' : '運費權重 ' + fmt(o.share, 5)) + '">' + fmt(o.ship) + '</td><td class="n"><b>' + fmt(o.total) + '</b></td>' +
      '<td class="wrap">' + (lk ? '<a href="' + esc(lk) + '" target="_blank" rel="noopener">' + esc(o.batch) + ' 📦</a>' : esc(o.batch)) + '</td>' +
      '<td><span class="tag s-' + esc(o.status) + '">' + esc(o.status) + '</span>' + (isLocked(o) ? ' <span title="已鎖定：要改請先刪除整張集運單">🔒</span>' : '') + '</td><td class="wrap muted">' + esc(o.note) + '</td>' +
      '<td><button class="btn sm" onclick="openOrder(' + idq + ')">編輯</button> <button class="btn sm" onclick="openSplit(' + idq + ')">拆單</button> <button class="btn sm danger" onclick="delOrder(' + idq + ')">刪</button></td></tr>';

function whoChange() { $('o-newwho').classList.toggle('hide', $('o-who').value !== '__new'); if ($('o-who').value === '__new') $('o-newwho-in').focus(); }

function rateManual(p) { $(p + '-rate').dataset.manual = '1'; }

    if (silent && $(p + '-rate').dataset.manual) return;
    $(p + '-rate').value = r.rate; if (!silent) $(p + '-rate').dataset.manual = '';
    $(p + '-rate-note').textContent = '（' + r.source + ' ' + r.date + ' ' + r.type + (r.date !== date ? '；' + date + ' 無牌價，取最近營業日' : '') + '）';

function calcOrder() {
  var s = D.settings, g = parseFloat($('o-cny').value), rate = parseFloat($('o-rate').value);
  if (isNaN(g) || isNaN(rate)) { $('o-prev').textContent = '填入金額與匯率後顯示台幣試算'; return; }
  var f1 = g * s.fee, f2 = (g + f1) * s.card, rw = (g + f1 + f2) * s.reward, twd = r2((g + f1 + f2 - rw) * rate);
  $('o-prev').innerHTML = '淘寶手續費 ¥' + fmt(f1) + '　刷卡手續費 ¥' + fmt(f2) + '　刷卡回饋 -¥' + fmt(rw) + '<br><b>商品台幣約 ' + fmt(twd) + '</b>（運費等集運單與重量確定後由試算表自動分攤）';
}
function saveOrder() {
  if ($('o-who').value === '__new') { toast('請先按「加入」新增人員，或改選現有人員', true); return; }
  var o = { id: editId, date: $('o-date').value, name: $('o-name').value, track: $('o-track').value, tb: $('o-tb').value, weight: $('o-weight').value, who: $('o-who').value,
    cny: $('o-cny').value, rate: $('o-rate').value, batch: $('o-batch').value, status: $('o-status').value, note: $('o-note').value };
  var again = !editId && $('o-again').checked;
  run(editId ? 'updateOrder' : 'addOrder', [o], '已儲存').then(function () {
    lastRate = o.rate;
    if (again) { editOrderKeep = { who: o.who, date: o.date, rate: o.rate }; closeM('m-order'); return load().then(function () { openOrder(); }); }

  run('deleteOrder', [id], '已刪除').then(load).catch(function () {});

/* ---------- 集運單 ---------- */

  D.batches.slice().reverse().forEach(function (b) {

var OPEN = {}, SHIPIDS = null, BATCH_SEL = null;
function toggleBatch(name) { if (OPEN[name]) delete OPEN[name]; else OPEN[name] = 1; renderBatches(); }
function batchDetail(b) {
  var rows = D.orders.filter(function (o) { return o.batch === b.name; }).sort(function (x, y) { return x.row - y.row; });
  if (!rows.length) return '<span class="muted">這個集運單還沒有品項（到訂單頁勾選訂單後歸入此集運單）</span>';
  var groups = {}, seen = [];
  rows.forEach(function (o) { if (!groups[o.who]) { groups[o.who] = []; seen.push(o.who); } groups[o.who].push(o); });
  var people = D.settings.people.filter(function (p) { return groups[p]; }).concat(seen.filter(function (p) { return D.settings.people.indexOf(p) < 0; }));
  var gt = 0, h = '';
  people.forEach(function (w) {
    var list = groups[w], item = 0, ship = 0, tot = 0;
    list.forEach(function (o) { item += Number(o.twd) || 0; ship += Number(o.ship) || 0; tot += Number(o.total) || 0; });
    gt += tot;
    var paid = D.payments.filter(function (p) { return p.who === w && p.batch === b.name; }).reduce(function (s, p) { return s + (Number(p.amount) || 0); }, 0);
    h += '<div style="margin:10px 0 4px"><b>' + esc(w) + '</b>　' + list.length + ' 筆　商品 ' + fmt(item) + ' ＋ 運費 ' + fmt(ship) + ' ＝ <b>' + fmt(tot) + '</b>' + (paid ? '　<span class="ok">此批已登記付款 ' + fmt(paid) + '</span>' : '') + '</div>';
    h += '<table style="width:100%"><tr><th>日期</th><th>品名</th><th>運單</th><th class="n">kg</th><th class="n">商品台幣</th><th class="n">運費權重</th><th class="n">運費分攤</th><th class="n">小計</th></tr>';
    list.forEach(function (o) {
      h += '<tr><td>' + esc(o.date) + '</td><td class="wrap">' + esc(o.name) + '</td><td>' + esc(o.track) + '</td>' +
        '<td class="n">' + (noW(o) ? '<span class="warn">未填</span>' : fmt(o.weight)) + '</td><td class="n">' + fmt(o.twd) + '</td><td class="n">' + (o.share === '' ? '' : fmt(o.share, 5)) + '</td><td class="n">' + fmt(o.ship) + '</td><td class="n"><b>' + fmt(o.total) + '</b></td></tr>';

  return h;
}

function carList() { return (D.settings.carriers || []).map(function (x) { var i = x.indexOf('|'); return { name: x.slice(0, i), url: x.slice(i + 1) }; }).filter(function (x) { return x.name && x.url.indexOf('{num}') >= 0; }); }

function parseLink(link) {          // 網址 → {car, num}；對不上任何公司就是自訂網址
  link = String(link || '').trim(); var L = carList();
  for (var i = 0; i < L.length; i++) { var m = link.match(carRe(L[i].url)); if (m) return { car: L[i].name, num: decodeURIComponent(m[1]) }; }
  return { car: link ? '' : (L[0] ? L[0].name : ''), num: link };
}
function fillCar(link) {
  var L = carList(), p = parseLink(link);
  $('b-car').innerHTML = L.map(function (x) { return '<option' + (x.name === p.car ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') + '<option value=""' + (p.car === '' && link ? ' selected' : '') + '>（自訂網址）</option>';
  $('b-link').value = p.num;
}
function linkIn() {                 // 貼整條網址時，自動認出公司並只留單號
  var v = $('b-link').value.trim(); if (!/^https?:\/\//i.test(v)) return;
  var p = parseLink(v); if (p.car) { $('b-car').value = p.car; $('b-link').value = p.num; }
}
function carChg() {}
function buildLink() {
  var v = $('b-link').value.trim(); if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  var L = carList().filter(function (x) { return x.name === $('b-car').value; })[0];
  return L ? L.url.replace('{num}', encodeURIComponent(v)) : v;
}
var KG_DEF = '';
function kgBlank() {                // 計費公斤清空時，還原成預設（所選訂單已知重量合計）
  if ($('b-kg').value.trim() === '' && KG_DEF !== '') { $('b-kg').value = KG_DEF; autoShip(); }
}
function openBatch(name) {
  KG_DEF = '';
  editBatch = name || null; BATCH_SEL = null; $('b-sel').classList.add('hide'); $('b-st-wrap').classList.add('hide');
  var b = name ? D.batches.filter(function (x) { return x.name === name; })[0] : null;
  $('mb-title').textContent = b ? '編輯集運單' : '新增集運單';
  $('b-date').value = b ? b.date : today(); $('b-name').value = b ? b.name : '';
  $('b-kg').value = b ? b.kg : ''; $('b-unit').value = b ? b.unit : ''; $('b-cny').value = b ? b.cny : '';
  $('b-cny').dataset.manual = b ? '1' : '';
  $('b-rate').value = b ? b.rate : ''; $('b-rate').dataset.manual = b ? '1' : ''; $('b-rate-note').textContent = '';
  if (b) { var wk = 0; D.orders.forEach(function (o) { if (o.batch === b.name) wk += Number(o.weight) || 0; }); if (wk > 0) KG_DEF = r2(wk); }
  fillCar(b ? b.link : ''); $('b-note').value = b ? b.note : '';
  var lb = D.batches.length ? D.batches[D.batches.length - 1] : null;
  fillRA('b-rcp', 'b-addr', b ? b.rcp : (lb ? lb.rcp : ''), b ? b.addr : (lb ? lb.addr : ''));
  calcBatch(); openM('m-batch');
  if (!b) fetchRate('b', true);
}
function autoShip() {
  var kg = parseFloat($('b-kg').value), u = parseFloat($('b-unit').value);
  if (!$('b-cny').dataset.manual && !isNaN(kg) && !isNaN(u)) $('b-cny').value = r2(kg * u);
  calcBatch();
}
function calcBatch() {
  var s = D.settings, g = parseFloat($('b-cny').value), rate = parseFloat($('b-rate').value);
  if (isNaN(g) || isNaN(rate)) { $('b-prev').textContent = '填入運費 ¥ 與匯率後顯示台幣'; return; }
  var f1 = g * s.fee, f2 = (g + f1) * s.card;
  $('b-prev').innerHTML = '運費台幣約 <b>' + fmt(r2((g + f1 + f2) * (1 - s.reward) * rate)) + '</b>（與訂單相同的手續費／回饋算法）。實際單價有時不是 kg × 單價，運費 ¥ 可手動改。';
}
function saveBatch() {

  var b = { oldName: editBatch, name: $('b-name').value, date: $('b-date').value, kg: $('b-kg').value, unit: $('b-unit').value,
    cny: $('b-cny').value, rate: $('b-rate').value, link: link, addr: $('b-addr').value, rcp: $('b-rcp').value, note: $('b-note').value };

  }).then(function () { closeM('m-batch'); return load(); }).then(function () { if (newBatch) batchShip(newBatch); }).catch(function () {});
}

  run('deleteBatch', [name], '已刪除').then(load).catch(function () {});

/* ---------- 結算 ---------- */
function renderSettle() {
  var S = D.settings, st = D.settle, R = Math.round;      // 結算金額：台幣四捨五入到整數
  var h = '<tr><th>人員</th><th class="n">應付（已集運）</th><th class="n">已付</th><th class="n">未付</th><th class="n">待出貨商品（未計運費）</th><th></th></tr>';
  var tDue = 0, tPaid = 0, tUn = 0, tPend = 0;
  st.persons.forEach(function (p) {
    var due = R(p.due), paid = R(p.paid), pend = R(p.pending), isNum = typeof p.unpaid === 'number', un = due - paid;
    tDue += due; tPaid += paid; tPend += pend; if (isNum) tUn += un;
    var uh = isNum ? '<b class="' + (un > 0 ? 'bad' : 'ok') + '">' + fmt(un, 0) + '</b>' : '<span class="muted">' + esc(p.unpaid) + '</span>';
    h += '<tr><td>' + esc(p.who) + '</td><td class="n">' + fmt(due, 0) + '</td><td class="n">' + fmt(paid, 0) + '</td><td class="n">' + uh + '</td><td class="n">' + fmt(pend, 0) + '</td><td><button class="btn sm pri" data-w="' + esc(p.who) + '" onclick="openStmt(this.dataset.w)">📄 對帳單</button></td></tr>';
  });
  h += '<tr><td><b>合計</b></td><td class="n"><b>' + fmt(tDue, 0) + '</b></td><td class="n"><b>' + fmt(tPaid, 0) + '</b></td><td class="n"><b>' + fmt(tUn, 0) + '</b></td><td class="n"><b>' + fmt(tPend, 0) + '</b></td><td></td></tr>';
  $('s-table').innerHTML = h;
  var ok = Math.abs(st.check) < 0.5;
  $('s-check').innerHTML = ok ? '<span class="ok">✔ 核對無誤（所有訂單總額 = 已集運 + 待出貨）</span>' :
    '<span class="bad">⚠ 核對差 ' + fmt(st.check) + '：可能有 WHO 不在人員清單，或訂單的集運單名稱不存在</span>';
  var lack = D.batches.map(function (b) { var n = D.orders.filter(function (o) { return o.batch === b.name && noW(o); }).length; return n ? b.name + '（' + n + ' 筆）' : ''; }).filter(Boolean);
  if (lack.length) $('s-check').innerHTML += '<div class="warn" style="margin-top:6px">⚠ 這些集運單還有品項未填重量，運費分攤暫時不準：' + esc(lack.join('、')) + '</div>';
  var m = '<tr><th>集運單</th>' + st.cols.map(function (c) { return '<th class="n">' + esc(c) + '</th>'; }).join('') + '<th class="n">合計</th></tr>';
  st.matrix.slice().reverse().forEach(function (r) {
    m += '<tr><td>' + esc(r.batch) + '</td>' + st.cols.map(function (c) { var v = r.cells[c]; return '<td class="n">' + (v ? fmt(v) : '<span class="muted">-</span>') + '</td>'; }).join('') + '<td class="n"><b>' + fmt(r.total) + '</b></td></tr>';
  });
  $('m-table').innerHTML = m;
}

/* ---------- 出貨資訊（品名、運單、項數與總重、收件資料） ---------- */
function openShipInfo() {

function buildShip() {
  var ids = SHIPIDS || Object.keys(SEL);

  var tr = rows.map(function (o) { return String(o.track).trim(); }).filter(function (t, i, arr) { return t && arr.indexOf(t) === i; }).join('+');   // 同一運單（拆單共用）只列一次
  var w = 0, miss = 0; rows.forEach(function (o) { if (noW(o)) miss++; else w += Number(o.weight); });
  $('sh-out').value = names + '\n' + tr + '\n共有' + rows.length + '項，總重為' + r2(w) + 'KG' + (miss ? '（另有' + miss + '筆未填重量）' : '') + '\n\n' + [$('sh-addr').value, $('sh-rcp').value].filter(Boolean).join('\n');

/* ---------- 對帳單（結算頁，貼給對方收錢用） ---------- */
var STMT_WHO = '';
function openStmt(who) { STMT_WHO = who; $('st-who').textContent = '— ' + who; buildStmt(); openM('m-stmt'); }
function md(d) { var p = String(d || '').split('-'); return p.length === 3 ? Number(p[1]) + '/' + Number(p[2]) : String(d || ''); }
function buildStmt() {
  var who = STMT_WHO, L = [], N = function (x) { return fmt(x, 2); };
  var mine = D.orders.filter(function (o) { return o.who === who; });
  var bs = D.batches.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  L.push('【代購對帳單】' + who, '');
  var due = 0;
  bs.forEach(function (b) {
    var rows = mine.filter(function (o) { return o.batch === b.name; });
    if (!rows.length) return;
    var sub = 0;
    L.push('■ 集運單 ' + b.name + '（' + md(b.date) + ' 集運，共 ' + rows.length + ' 件）');
    rows.forEach(function (o, i) {
      var a = Number(o.twd) || 0, s = Number(o.ship) || 0, t = r2(a + s); sub = r2(sub + t);   // 和試算表一樣取到小數 2 位，明細加起來 = 小計
      L.push((i + 1) + '. ' + o.name + '　' + (a ? '商品 ' + N(a) + ' ＋ ' : '') + '運費 ' + N(s) + ' ＝ ' + N(t));
    });
    L.push('　小計 NT$ ' + N(sub), ''); due += sub;
  });
  var s = D.settle.persons.filter(function (p) { return p.who === who; })[0];
  var paidList = D.payments.filter(function (p) { return p.who === who; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var paid = 0; paidList.forEach(function (p) { paid += Number(p.amount) || 0; });
  if ($('st-paid').checked && paidList.length) {
    L.push('■ 已付款');
    paidList.forEach(function (p) { L.push('　' + md(p.date) + '　NT$ ' + fmt(Math.round(p.amount), 0) + (p.method ? '（' + p.method + '）' : '') + (p.batch ? ' ' + p.batch : '')); });
    L.push('');
  }
  var I = function (x) { return fmt(Math.round(x), 0); }, un = Math.round(due) - Math.round(paid);   // 最後金額四捨五入成整數
  if (who === D.settings.payer) L.push('────────────', '應付合計　NT$ ' + I(due), '（你是代墊運費的人，這是自己的份，不用收）');
  else L.push('────────────', '應付合計　NT$ ' + I(due), '已付　　　NT$ ' + I(paid), '未付　　　NT$ ' + fmt(un, 0));
  if ($('st-pend').checked) {
    var pend = mine.filter(function (o) { return !o.batch; });
    if (pend.length) {
      var ps = 0; L.push('', '■ 尚未集運（運費還沒算，先不用付）');
      pend.forEach(function (o, i) { var a = Number(o.twd) || 0; ps += a; L.push((i + 1) + '. ' + o.name + (a ? '　商品 ' + N(a) : '')); });
      if (ps) L.push('　商品合計 NT$ ' + N(ps));
    }
  }
  $('st-out').value = L.join('\n');
}
function copyStmt() {
  var t = $('st-out'); t.select();
  try { document.execCommand('copy'); toast('已複製'); } catch (e) { toast('請手動全選複製', true); }
}

/* ---------- 補重量 ---------- */
var WTMP = {};
function openWeights() {
  WTMP = {};
  $('w-batch').innerHTML = '<option value="">（全部）</option><option value="__none">（未集運）</option>' + D.batches.slice().reverse().map(function (b) { return '<option>' + esc(b.name) + '</option>'; }).join('');
  var cur = $('f-batch').value; if (cur) $('w-batch').value = cur;
  $('w-only').checked = true; renderWeights(); openM('m-weights');
}
function wRows() {
  var bt = $('w-batch').value, only = $('w-only').checked;
  return D.orders.filter(function (o) {
    if (bt === '__none' ? o.batch !== '' : (bt && o.batch !== bt)) return false;
    if (only && !noW(o)) return false;
    return true;
  }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : b.row - a.row; });
}
function renderWeights() {
  var h = '<tr><th>日期</th><th>品名</th><th>WHO</th><th>集運單</th><th class="n">重量 kg</th></tr>';
  wRows().forEach(function (o) {
    var v = WTMP.hasOwnProperty(o.id) ? WTMP[o.id] : o.weight;
    h += '<tr><td>' + esc(o.date) + '</td><td class="wrap">' + esc(o.name) + '</td><td>' + esc(o.who) + '</td><td>' + esc(o.batch) + '</td>' +
      '<td class="n"><input type="number" step="0.01" style="width:90px" value="' + esc(v) + '" oninput="WTMP[\'' + esc(o.id) + '\']=this.value;updWSum()"></td></tr>';
  });
  $('w-table').innerHTML = h; updWSum();
}
function updWSum() {
  var bt = $('w-batch').value, b = D.batches.filter(function (x) { return x.name === bt; })[0];
  if (!b) { $('w-sum').textContent = ''; return; }
  var sum = 0, miss = 0;
  D.orders.forEach(function (o) {
    if (o.batch !== bt) return;
    var w = WTMP.hasOwnProperty(o.id) ? parseFloat(WTMP[o.id]) : Number(o.weight);
    if (w > 0) sum += w; else miss++;
  });
  $('w-sum').innerHTML = '集運單計費 ' + fmt(b.kg, 2) + ' kg；已填合計 ' + fmt(sum, 2) + ' kg；差 <b>' + fmt(r2(b.kg - sum), 2) + '</b> kg' + (miss ? '；仍有 ' + miss + ' 筆未填' : '');
}
function saveWeights() {
  var list = [];
  Object.keys(WTMP).forEach(function (id) {
    var o = D.orders.filter(function (x) { return x.id === id; })[0];
    if (o && String(WTMP[id]) !== String(o.weight)) list.push({ id: id, weight: WTMP[id] });
  });
  if (!list.length) { closeM('m-weights'); return; }
  run('setWeights', [list], '已更新 ' + list.length + ' 筆重量').then(function () { closeM('m-weights'); return load(); }).catch(function () {});
}

/* ---------- 拆單（同一筆淘寶訂單，多人分攤）---------- */

/* ---------- 設定 ---------- */
function lines(id) { return $(id).value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }
function saveSet() {
  var st = { fee: $('s-fee').value, card: $('s-card').value, reward: $('s-reward').value, payer: $('s-payer').value, rateType: $('s-rtype').value,
    people: lines('s-people'), recipients: lines('s-rcps'), addresses: lines('s-addrs'), carriers: lines('s-carriers'), statuses: lines('s-statuses'), methods: lines('s-methods') };
  if (st.people.indexOf(st.payer) < 0) { toast('代墊人必須在人員清單內', true); return; }
  if ([st.fee, st.card, st.reward].some(function (x) { return x === '' || isNaN(x); })) { toast('費率請填數字', true); return; }
  run('saveSettings', [st], '設定已儲存').then(load).catch(function () {});
}

document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeM('m-order'); closeM('m-batch'); } });

/* ---------- 啟動 ---------- */
load();

/* ---------- 手機版：表格每列變卡片（把表頭文字貼到每個格子上） ---------- */
function labelize(root) {
  var ts = root.tagName === 'TABLE' ? [root] : [].slice.call(root.querySelectorAll('table'));
  ts.forEach(function (t) {
    var rows = [].slice.call(t.rows), heads = null;
    rows.forEach(function (r) {
      var ths = [].slice.call(r.children).filter(function (c) { return c.tagName === 'TH'; });
      if (ths.length && ths.length === r.children.length) { heads = ths.map(function (x) { return x.textContent.replace(/（.*?）/g, '').trim(); }); r.className = 'hr'; return; }
      r.className = 'dr';
      if (!heads) return;
      var tds = [].slice.call(r.children);
      if (tds.length !== heads.length) return;
      tds.forEach(function (td, i) { td.setAttribute('data-label', heads[i]); });
    });
  });
}
(function () {
  if (typeof MutationObserver === 'undefined') return;
  var mo = new MutationObserver(function (muts) { muts.forEach(function (m) { if (m.target.nodeType === 1) labelize(m.target.tagName === 'TABLE' ? m.target : (m.target.closest ? (m.target.closest('table') || m.target) : m.target)); }); });
  mo.observe(document.body, { childList: true, subtree: true });
  [].forEach.call(document.querySelectorAll('table'), labelize);
})();
</script>
