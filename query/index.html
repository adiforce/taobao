<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>集運單查詢</title>
<style>
  :root { --bg:#f5f5f4; --card:#fff; --line:#e7e5e4; --line2:#f0efee; --text:#1c1917; --sub:#78716c; --accent:#ea580c; --ok:#15803d; --ok-s:#ecfdf3; --bad:#dc2626; --warn:#d97706; --r:14px; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); font-size:15px; line-height:1.5; }
  a { color:#2563eb; text-decoration:none; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin:4px 0 14px; }
  .hide { display:none !important; }
  .muted { color:var(--sub); } .ok { color:var(--ok); } .bad { color:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:16px; box-shadow:0 1px 8px rgba(28,25,23,.04); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input#gin { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px; flex:1; min-width:0; }
  select { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; min-width:260px; max-width:100%; flex:1; }
  .btn { font:inherit; padding:9px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn:disabled { opacity:.5; }
  .tag { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:500; background:#f5f5f4; color:#57534e; white-space:nowrap; }
  .tag.s-已下單 { background:#eff6ff; color:#1d4ed8; }
  .tag.s-已出貨 { background:#fff7ed; color:#c2410c; }
  .tag.s-在集運倉 { background:#fefce8; color:#a16207; }
  .tag.s-集運回台 { background:#f5f3ff; color:#6d28d9; }
  .tag.s-已完成 { background:var(--ok-s); color:var(--ok); }
  .tag.dy { background:#f0f9ff; color:#0369a1; font-size:11px; padding:1px 7px; margin-left:4px; }
  .tag.paid { background:var(--ok-s); color:var(--ok); }
  .tag.unpaid { background:#fef2f2; color:var(--bad); }
  .wtag { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; font-weight:500; }
  table { border-collapse:separate; border-spacing:0; width:100%; }
  th, td { padding:7px 9px; border-bottom:1px solid var(--line2); text-align:left; white-space:nowrap; vertical-align:middle; }
  th { background:#fafaf9; color:var(--sub); font-size:12px; font-weight:600; border-bottom:1px solid var(--line); }
  tr:last-child > td { border-bottom:0; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { font:inherit; padding:7px 16px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--sub); cursor:pointer; }
  .tabs button.on { background:var(--text); color:#fff; border-color:var(--text); }
  .big { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 14px; }
  .big > div { flex:1; min-width:120px; border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
  .big .k { font-size:12px; color:var(--sub); } .big .v { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .bh { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin:14px 0 6px; font-size:14px; }
  .sm2 { font-size:12px; margin-top:2px; }
  /* 以下與管理後台的「集運單明細表」相同 */
  .shtwrap { background:#fff; padding:6px 2px; }
  .shthead { display:flex; gap:12px; align-items:baseline; margin-bottom:10px; font-size:16px; flex-wrap:wrap; }
  .shtgrid { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:16px; align-items:start; }
  table.sht { border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:13px; margin-bottom:12px; }
  table.sht td.tk { font-variant-numeric:tabular-nums; color:#57534e; }
  table.sht tr.sum td { background:#fafaf9; font-weight:700; border-top:1px solid var(--line); }
  table.sht.kv td:first-child { color:#57534e; }
  .shtl { overflow-x:auto; }
  .note { font-size:12px; color:var(--sub); margin-top:8px; }
  @media (max-width:760px) {
    main { padding:14px 10px 50px; }
    .shtgrid { grid-template-columns:1fr; }
    table.sht th, table.sht td { font-size:12px; padding:6px; }
  }
</style>
</head>
<body>
<main>
  <h1>📦 集運單查詢</h1>
  <div class="card hide" id="gate" style="max-width:420px">
    <div style="margin-bottom:10px"><b>請輸入通行碼</b></div>
    <div class="bar"><input id="gin" type="password" inputmode="numeric" autocomplete="off" placeholder="通行碼" onkeydown="if(event.key==='Enter')enter()"><button class="btn pri" id="gbtn" onclick="enter()">進入</button></div>
    <div id="gmsg" class="note"></div>
  </div>
  <div id="app" class="hide">
  <div class="card">
    <div class="tabs"><button id="t-b" class="on" onclick="mode('b')">依集運單</button><button id="t-p" onclick="mode('p')">依人（查未付款）</button></div>
    <div class="bar">
      <select id="sel" onchange="pick(this.value)"><option value="">載入中…</option></select>
      <select id="psel" class="hide" onchange="pickP(this.value)"><option value="">— 請選擇人 —</option></select>
      <label id="paidlab" class="hide muted" style="font-size:13px"><input type="checkbox" id="showpaid" onchange="renderP()"> 也顯示已付清的集運單</label>
      <button class="btn pri hide" id="save" onclick="saveImg()" disabled>存成圖片</button>
    </div>
    <div id="meta" class="note"></div>
  </div>
  <div id="msg" class="muted"></div>
  <div class="card" id="box" style="display:none"></div>
  <div style="text-align:center;margin-top:20px"><a href="#" class="muted" style="font-size:12px" onclick="logout();return false">登出</a></div>
  </div>
</main>

<script>
// ↓↓↓ 部署「集運單查詢 API」後，把網頁應用程式網址（/exec 結尾）貼在這裡 ↓↓↓
var API_URL = 'https://script.google.com/macros/s/AKfycbx0hb6MZ3j-rqSONl6JDLroLWahDNNV-7WmldIQLbmNbJjqmF2FepSxo2VcBTqGm9tH/exec';

var WHO_COLOR = { 'J*': '#d3f5d8', 'A**': '#ffd9e6', 'K*****': '#fff3b0' };   // 遮罩後名字的標籤底色
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function fmt(n, d) { if (n === '' || n == null || isNaN(n)) return ''; d = d == null ? 2 : d; return Number(n).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function whoTag(w) { var c = WHO_COLOR[w]; return c ? '<span class="wtag" style="background:' + c + '">' + esc(w) + '</span>' : esc(w); }
function stTag(s) { return s ? '<span class="tag s-' + esc(s) + '">' + esc(s) + '</span>' : ''; }
function isDy(o) { return Number(o.cny) === 0 && String(o.cny) !== ''; }
function noW(o) { return !(Number(o.weight) > 0); }
var KEY = '';
try { KEY = localStorage.getItem('cq_key') || ''; } catch (e) {}
function api(q) {
  if (!API_URL) return Promise.reject(new Error('尚未設定 API_URL'));
  return fetch(API_URL + (API_URL.indexOf('?') < 0 ? '?' : '&') + q + '&key=' + encodeURIComponent(KEY)).then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) { var e = new Error(j.error || '查詢失敗'); e.code = j.error; throw e; } return j; });
}

/* ---------- 通行碼 ---------- */
function gate(msg) { $('app').classList.add('hide'); $('gate').classList.remove('hide'); $('gmsg').textContent = msg || ''; $('gin').focus(); }
function enter() {
  var v = $('gin').value.trim(); if (!v) return;
  KEY = v; $('gmsg').textContent = '驗證中…'; $('gbtn').disabled = true;
  api('action=list').then(function (j) {
    try { localStorage.setItem('cq_key', KEY); } catch (e) {}
    $('gate').classList.add('hide'); $('app').classList.remove('hide'); $('gin').value = ''; boot(j);
  }).catch(function (e) {
    $('gbtn').disabled = false; KEY = '';
    try { localStorage.removeItem('cq_key'); } catch (x) {}
    gate(e.code === 'AUTH' ? '通行碼不正確' : e.code === 'LOCK' ? '嘗試次數過多，請 10 分鐘後再試' : '連線失敗：' + e.message);
  });
}
function logout() { KEY = ''; try { localStorage.removeItem('cq_key'); } catch (e) {} location.hash = ''; location.reload(); }

var CUR = '', LABEL = '', PD = null, MODE = 'b';
function hashSet(v) { history.replaceState(null, '', v ? '#' + v : location.pathname + location.search); }
function mode(m) {
  MODE = m; CUR = ''; PD = null; $('msg').textContent = ''; $('box').style.display = 'none'; $('save').classList.add('hide'); $('meta').innerHTML = ''; hashSet('');
  $('t-b').className = m === 'b' ? 'on' : ''; $('t-p').className = m === 'p' ? 'on' : '';
  $('sel').classList.toggle('hide', m !== 'b'); $('psel').classList.toggle('hide', m !== 'p'); $('paidlab').classList.toggle('hide', m !== 'p');
  $('sel').value = ''; $('psel').value = '';
}
var H = decodeURIComponent((location.hash || '').replace(/^#/, ''));
function boot(j) {
  var s = $('sel');
  s.innerHTML = '<option value="">— 請選擇集運單 —</option>' + j.batches.map(function (b) {
    return '<option value="' + esc(b.name) + '">' + esc(b.name) + (b.status ? '　【' + esc(b.status) + '】' : '') + '</option>';
  }).join('');
  if (H && H.indexOf('p/') !== 0) { var n = H.replace(/^b\//, ''); if (j.batches.some(function (b) { return b.name === n; })) { s.value = n; pick(n); } }
api('action=people').then(function (j) {
  $('psel').innerHTML = '<option value="">— 請選擇人 —</option>' + j.people.map(function (w) { return '<option value="' + esc(w) + '">' + esc(w) + '</option>'; }).join('');
  if (H.indexOf('p/') === 0 && j.people.indexOf(H.slice(2)) >= 0) { mode('p'); $('psel').value = H.slice(2); pickP(H.slice(2)); }
}).catch(function () {});
}
if (KEY) { $('gin').value = KEY; enter(); } else gate();

function pickP(w) {
  CUR = w; PD = null; $('msg').textContent = ''; $('box').style.display = 'none'; $('save').classList.add('hide'); $('meta').innerHTML = '';
  if (!w) return;
  hashSet('p/' + encodeURIComponent(w)); $('msg').textContent = '查詢中…';
  api('action=person&who=' + encodeURIComponent(w)).then(function (d) {
    if (CUR !== w) return; $('msg').textContent = ''; PD = d; renderP();
  }).catch(function (e) { $('msg').textContent = '查詢失敗：' + e.message; });
}
function renderP() {
  var d = PD; if (!d) return;
  var all = $('showpaid').checked, list = d.batches.filter(function (b) { return all || b.unpaid > 0.5; });
  var ok = d.unpaid <= 0.5;
  var h = '<div class="big"><div><div class="k">應付</div><div class="v ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓ 已付清' : fmt(d.unpaid, 0)) + '</div></div></div>';
  if (d.otherPaid > 0.5) h += '<div class="note" style="margin:-6px 0 8px">已付款中有 ' + fmt(d.otherPaid, 0) + ' 未指定集運單，下方各集運單的「尚欠」未扣除這筆。</div>';
  if (!list.length) h += '<div class="muted" style="padding:10px 0">沒有未付款的集運單 🎉</div>';
  list.forEach(function (b) {
    var tw = 0, ts = 0, tk = 0;
    h += '<div class="bh"><b>📦 ' + esc(b.name) + '</b>' + stTag(b.status) + '<span class="muted">應付 ' + fmt(b.due, 0) + '　已付 ' + fmt(b.paid, 0) + '</span>' +
      (b.unpaid > 0.5 ? '<span class="tag unpaid">尚欠 ' + fmt(b.unpaid, 0) + '</span>' : '<span class="tag paid">✓ 已付款</span>') + '</div>' +
      '<div class="shtl"><table class="sht"><tr><th>品名</th><th>單號</th><th class="n">重量</th><th class="n">商品</th><th class="n">運費</th><th class="n">小計</th></tr>';
    b.rows.forEach(function (o) {
      var a = Number(o.twd) || 0, sh = Number(o.ship) || 0, k = Number(o.weight) || 0; tw += a; ts += sh; tk += k;
      h += '<tr><td>' + esc(o.name || '（未填品名）') + (isDy(o) ? ' <span class="tag dy">代運</span>' : '') + '</td><td class="tk">' + esc(o.track || '') + '</td><td class="n">' + (noW(o) ? '-' : fmt(k, 1)) + '</td><td class="n">' + (isDy(o) ? '<span class="muted">-</span>' : fmt(a, 0)) + '</td><td class="n">' + fmt(sh, 0) + '</td><td class="n"><b>' + fmt(a + sh, 0) + '</b></td></tr>';
    });
    h += '<tr class="sum"><td colspan="2">合計 ' + b.rows.length + ' 件</td><td class="n">' + fmt(tk, 1) + '</td><td class="n">' + fmt(tw, 0) + '</td><td class="n">' + fmt(ts, 0) + '</td><td class="n">' + fmt(tw + ts, 0) + '</td></tr></table></div>';
  });
  $('box').innerHTML = '<div id="sheet-cap" class="shtwrap"><div class="shthead"><b>👤 ' + esc(d.who) + ' 付款明細</b></div>' + h + '</div>';
  LABEL = '付款明細_' + d.who.replace(/\*/g, '＊');
  $('box').style.display = ''; $('save').classList.remove('hide'); $('save').disabled = false;
}

function pick(name) {
  CUR = name; $('msg').textContent = ''; $('box').style.display = 'none'; $('save').classList.add('hide'); $('meta').innerHTML = '';
  if (!name) return;
  hashSet('b/' + encodeURIComponent(name)); LABEL = '集運單明細_' + name;
  $('msg').textContent = '查詢中…';
  api('action=batch&name=' + encodeURIComponent(name)).then(function (b) {
    if (CUR !== name) return;
    $('msg').textContent = ''; render(b);
  }).catch(function (e) { $('msg').textContent = '查詢失敗：' + e.message; });
}

function render(b) {
  var rows = b.rows, tw = 0, ts = 0, tk = 0;
  var h = '<table class="sht"><tr><th>人</th><th>品名</th><th>單號</th><th class="n">重量</th><th class="n">商品</th><th class="n">運費</th><th class="n">小計</th></tr>';
  rows.forEach(function (o) {
    var a = Number(o.twd) || 0, sh = Number(o.ship) || 0, k = Number(o.weight) || 0; tw += a; ts += sh; tk += k;
    h += '<tr><td>' + whoTag(o.who) + '</td><td>' + esc(o.name || '（未填品名）') + (isDy(o) ? ' <span class="tag dy">代運</span>' : '') + '</td><td class="tk">' + esc(o.track || '') + '</td><td class="n">' + (noW(o) ? '-' : fmt(k, 1)) + '</td><td class="n">' + (isDy(o) ? '<span class="muted">-</span>' : fmt(a, 0)) + '</td><td class="n">' + fmt(sh, 0) + '</td><td class="n"><b>' + fmt(a + sh, 0) + '</b></td></tr>';
  });
  h += '<tr class="sum"><td colspan="3">合計 ' + rows.length + ' 件</td><td class="n">' + fmt(tk, 1) + '</td><td class="n">' + fmt(tw, 0) + '</td><td class="n">' + fmt(ts, 0) + '</td><td class="n">' + fmt(tw + ts, 0) + '</td></tr></table>';
  var r = '<table class="sht"><tr><th>人</th><th class="n">件</th><th class="n">應付</th></tr>';
  b.persons.forEach(function (p) {
    var due = p.a + p.s, st;
    if (p.payer) st = '<span class="tag">代墊人</span>';
    else if (p.paid > 0 && p.paid + 0.5 >= due) st = '<span class="tag paid">✓ 已付款</span>';
    else if (p.paid > 0) st = '<span class="tag unpaid">尚欠 ' + fmt(due - p.paid, 0) + '</span>';
    else st = '<span class="tag unpaid">未付款</span>';
    r += '<tr><td>' + whoTag(p.who) + '</td><td class="n">' + p.n + '</td><td class="n"><b>' + fmt(due, 0) + '</b><div class="muted sm2">商品 ' + fmt(p.a, 0) + ' ＋ 運 ' + fmt(p.s, 0) + '</div>' +
      '<div class="sm2">' + st + (p.paid > 0 && !p.payer ? ' <span class="muted">已收 ' + fmt(p.paid, 0) + '</span>' : '') + '</div></td></tr>';
  });
  r += '</table><table class="sht kv"><tr><td>總商品</td><td class="n">' + fmt(tw, 0) + '</td></tr><tr><td>總運費</td><td class="n">' + fmt(ts, 0) + '</td></tr>' +
    (b.kg ? '<tr><td class="muted">計費</td><td class="n muted">' + fmt(b.kg) + ' kg × ¥' + fmt(b.unit) + ' × ' + fmt(b.rate, 3) + '</td></tr>' : '') +
    '<tr class="sum"><td>合計</td><td class="n">' + fmt(tw + ts, 0) + '</td></tr></table>';
  $('box').innerHTML = '<div id="sheet-cap" class="shtwrap"><div class="shthead"><b>📦 ' + esc(b.name) + '</b><span class="muted">' + esc(b.date || '') + (b.kg ? '　' + fmt(b.kg, 0) + ' kg' : '') + '</span>' + stTag(b.status) + '</div>' +
    '<div class="shtgrid"><div class="shtl">' + h + '</div><div class="shtr">' + r + '</div></div></div>';
  $('box').style.display = ''; $('save').classList.remove('hide'); $('save').disabled = false;
  $('meta').innerHTML = b.link ? '<a href="' + esc(b.link) + '" target="_blank" rel="noopener">查貨態 ↗</a>' : '';
}

function saveImg() {
  var btn = $('save'), go = function () {
    btn.disabled = true; btn.textContent = '產生中…';
    html2canvas($('sheet-cap'), { backgroundColor: '#ffffff', scale: 2, windowWidth: 1100, onclone: function (d) { var c = d.getElementById('sheet-cap'); c.style.width = '1040px'; c.style.padding = '16px'; } }).then(function (cv) {
      btn.disabled = false; btn.textContent = '存成圖片';
      cv.toBlob(function (blob) {
        var fn = LABEL + '.png', file = null;
        try { file = new File([blob], fn, { type: 'image/png' }); } catch (e) {}
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function () {}); return; }
        var url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
      }, 'image/png');
    }).catch(function (e) { btn.disabled = false; btn.textContent = '存成圖片'; alert('存圖失敗，請直接截圖：' + e); });
  };
  if (window.html2canvas) return go();
  var sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  sc.onload = go; sc.onerror = function () { alert('載入存圖工具失敗，請直接截圖'); }; document.head.appendChild(sc);
}
</script>
</body>
</html>
